---
# Sized from measured use (argo-setup/README.md, "Resource sizing"):
# memory peak 973Mi, CPU p90 48m.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: argocd-application-controller
          resources:
            requests:
              cpu: 63m
              memory: 1280Mi
            limits:
              cpu: '2'
              memory: 1280Mi
