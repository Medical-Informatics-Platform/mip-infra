---
# Sized from measured use (argo-setup/README.md, "Resource sizing"):
# memory peak 55Mi, CPU p90 2m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 256Mi
