---
# Sized from measured use (argo-setup/README.md, "Resource sizing"):
# memory peak 41Mi, CPU p90 2m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-notifications-controller
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
