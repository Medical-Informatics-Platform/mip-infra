---
# Wrapper Application for manual bootstrap or testing. In normal operation the
# mip-infrastructure ApplicationSet (base/mip-infrastructure) discovers this
# directory itself; do not apply both.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: federation-mippublic-hybrid
  namespace: argocd-mip-team
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true  # needed for exareme sts
    argocd.argoproj.io/webhook-timeout: '30'
spec:
  project: mip-argo-project-federations
  source:
    repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
    targetRevision: main
    path: deployments/hybrid/federations/federation-Z/mip-infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-mip-team
  syncPolicy:
    syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
    automated:
      selfHeal: true
