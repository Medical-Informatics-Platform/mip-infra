---
# Service the remote federation-Z workers reach over Submariner. Lighthouse
# publishes it as <name>.federation-z.svc.clusterset.local on every joined
# cluster. The aggregation server is needed by every computation that runs on a
# remote worker. The controller is not exported: remote nodes do not reach its
# API (network-policy.yaml).
apiVersion: multicluster.x-k8s.io/v1beta1
kind: ServiceExport
metadata:
  name: exaflow-aggregation-service
  namespace: federation-z
