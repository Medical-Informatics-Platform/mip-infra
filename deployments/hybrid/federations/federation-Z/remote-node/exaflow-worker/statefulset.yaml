---
# exaflow local worker, derived from kubernetes/templates/exaflow-localworker.yaml
# of madgik/exaflow at d72983f4ee248785377b3f26f263c4aa2619fee2 (image 1.1.0,
# the revision pinned in deployments/shared-apps/exareme2/exareme2.yaml).
# Reduced to the worker only: the upstream chart always renders the controller
# and the global worker, which run on the central cluster.
#
# Differences from the upstream template:
#   - WORKER_IDENTIFIER is set explicitly (deploy-worker.sh substitutes the
#     placeholder with the Submariner cluster ID) instead of the node name,
#     which could collide with a central node name.
#   - CONTROLLER_IP and AGGREGATION_SERVER_DNS use clusterset names exported by
#     the central cluster; the service-link environment variables the template
#     relies on do not exist across clusters.
#   - /opt/csvs is a ConfigMap with the synthetic data model.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: exaflow-localworker
  namespace: federation-z
  labels:
    app: exaflow-worker
    nodeType: localworker
spec:
  serviceName: exareme2-test-workers-service
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app: exaflow-worker
      nodeType: localworker
  template:
    metadata:
      labels:
        app: exaflow-worker
        nodeType: localworker
    spec:
      volumes:
        - name: duckdb-data
          emptyDir: {}
        - name: csv-data
          configMap:
            name: synthetic-data  # built by deploy-worker.sh: CDEsMetadata.json and the node's CSV
      containers:
        - name: worker
          image: madgik/exaflow_worker:1.1.0
          ports:
            - name: grpc
              containerPort: 5672
              protocol: TCP
          volumeMounts:
            - mountPath: /opt/data
              name: duckdb-data
            - mountPath: /opt/csvs/synthetic_v_0_1  # one directory per data model under DATA_PATH
              name: csv-data
              readOnly: true
          env:
            - name: WORKER_IDENTIFIER
              value: __WORKER_IDENTIFIER__
            - name: WORKER_ROLE
              value: LOCALWORKER
            - name: FEDERATION
              value: dementia  # must equal the central controller's federation value
            - name: LOG_LEVEL
              value: INFO
            - name: FRAMEWORK_LOG_LEVEL
              value: ERROR
            - name: CONTROLLER_IP
              value: exaflow-controller-service.federation-z.svc.clusterset.local
            - name: CONTROLLER_PORT
              value: '5000'
            - name: WORKER_TASKS_TIMEOUT
              value: '300'
            - name: DATA_PATH
              value: /opt/csvs
            - name: DUCKDB_PATH
              value: /opt/data/data_models.duckdb
            - name: GRPC_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GRPC_PORT
              value: '5672'
            - name: GRPC_MAX_WORKERS
              value: '20'
            - name: AGGREGATION_SERVER_ENABLED
              value: 'true'
            - name: AGGREGATION_SERVER_DNS
              value: exaflow-aggregation-service.federation-z.svc.clusterset.local
            - name: SMPC_ENABLED
              value: 'false'
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1536Mi
          startupProbe:
            exec:
              command: [python, -m, exaflow.worker.healthcheck]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 10
          livenessProbe:
            exec:
              command: [python, -m, exaflow.worker.healthcheck]
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command: [python, -m, exaflow.worker.healthcheck]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
