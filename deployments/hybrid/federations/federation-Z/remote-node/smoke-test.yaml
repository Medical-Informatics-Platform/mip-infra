---
# Throwaway service used to prove cross-cluster routing and clusterset DNS.
# Apply on the remote node, resolve and curl from the central cluster, then
# delete on both sides (README, step 6).
apiVersion: v1
kind: Namespace
metadata:
  name: submariner-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-nginx
  namespace: submariner-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-nginx
  template:
    metadata:
      labels:
        app: smoke-nginx
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-nginx
  namespace: submariner-smoke
spec:
  selector:
    app: smoke-nginx
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: smoke-nginx
  namespace: submariner-smoke
