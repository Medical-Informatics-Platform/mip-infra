---
# The federation's copy of the notebook examples: the mip-examples commit pinned in
# EXAMPLES_REVISION below, deployed into every federation namespace as a source of its
# mip-stack app (../mip-stack.yaml). Notebooks mount it read-only (notebook operator,
# EXAMPLES_CLAIM) and see each update live: CephFS is shared, so no pod restart.
#
# Updates go through this repo: when mip-examples master moves, Renovate opens a PR that moves
# EXAMPLES_REVISION (renovate.json5). Example code runs in users' notebooks next to their
# platform token, so review the compare link in that PR like code.
#
# The namespace is .Release.Namespace: Argo CD renders this chart into the destination namespace
# of each federation's mip-stack Application, so no federation needs a patch for it.
#
# Unwanted content (data, outputs): pin a commit without it (remove it from master first,
# rewriting history if it was data); the next sync swaps it in and deletes the rev before the
# previous one. To drop it at once, suspend notebook-examples-sync and delete the PVC; Argo CD
# recreates it and the next sync fills it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notebook-examples
  namespace: '{{ .Release.Namespace }}'
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ceph-corbo-cephfs
  resources:
    requests: {storage: 1Gi}
---
# Every 15 minutes: if EXAMPLES_REVISION is not live yet, fetch exactly that commit (public
# repo, HTTPS through the federation's 80/443 egress), copy it to rev-<sha> and swap the
# examples symlink in one rename, so notebooks never see a half-written tree. The previous rev
# stays until the next update, so a kernel started in the old tree keeps its working directory.
# Already live: exit without touching the network.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notebook-examples-sync
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: notebook-examples-sync
spec:
  schedule: '*/15 * * * *'
  # Forbid keeps runs from overlapping; the deadlines keep a hung run from blocking later ones.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: notebook-examples-sync
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65533
            runAsGroup: 65533
            # The CephFS driver applies fsGroup (fsGroupPolicy: File).
            fsGroup: 65533
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: sync
              # Docker Official Image with git (Debian trixie). Pinned by digest; Renovate follows the
              # tag (renovate.json5, kubernetes manager).
              image: buildpack-deps:trixie-scm@sha256:4241005cb2c47ea99750627baeb06714f6fde7f01a69ce451d85f8dccf0f5691
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  url=https://github.com/Medical-Informatics-Platform/mip-examples.git
                  rev=$EXAMPLES_REVISION
                  printf '%s\n' "$rev" | grep -Eqx '[0-9a-f]{40}'
                  live=$(readlink /data/examples || true)
                  [ "rev-$rev" != "$live" ] || exit 0
                  git init -q /tmp/src
                  git -C /tmp/src fetch -q --depth 1 "$url" "$rev"
                  git -C /tmp/src checkout -q --detach FETCH_HEAD
                  [ "$(git -C /tmp/src rev-parse HEAD)" = "$rev" ]
                  rm -rf /tmp/src/.git /tmp/src/.github "/data/rev-$rev"
                  cp -R /tmp/src "/data/rev-$rev"
                  ln -sfn "rev-$rev" /data/.examples-new
                  mv -T /data/.examples-new /data/examples
                  find /data -mindepth 1 -maxdepth 1 ! -name examples ! -name "rev-$rev" ! -name "${live:-examples}" -exec rm -rf {} +
                  echo "examples at $rev"
              env:
                - {name: HOME, value: /tmp}
                # The reviewed mip-examples commit to serve; Renovate moves it by PR (see the top).
                - {name: EXAMPLES_REVISION, value: c4b1cd8110b35f20df121af622e606e6506a6313}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: notebook-examples}
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
