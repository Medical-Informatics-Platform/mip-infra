---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # This name will be overridden by the federation-specific kustomize patch
  name: mip-stack
  namespace: argocd-mip-team
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  sources:
    - repoURL: https://github.com/Medical-Informatics-Platform/mip
      targetRevision: b071e80c0e4671b02b5884e7f352dadc4ff2b78b  # 9.2.1
      path: deployment/kubernetes
      helm:
        valueFiles:
          - values.yaml
          - $values/deployments/shared-apps/mip-stack/values.yaml
    - repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
      targetRevision: main
      ref: values
    # Shared read-only notebook examples, one copy per federation (notebook-examples/ next to this
    # file): a chart, so Argo CD renders it into the destination namespace (.Release.Namespace).
    - repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
      targetRevision: main
      path: deployments/shared-apps/mip-stack/notebook-examples
  destination:
    server: https://kubernetes.default.svc
    # This will be overridden by the federation-specific kustomize patch
    namespace: placeholder-namespace
  syncPolicy:
    syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
    automated:
      selfHeal: true
