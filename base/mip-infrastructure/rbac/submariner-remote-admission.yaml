---
# Broker access of the remote clusters (Submariner 0.25, Kubernetes 1.30 or later).
#
# Contents:
#   1. Role submariner-remote-cluster: what one remote cluster may do in the broker namespace.
#   2. Role submariner-remote-cluster-secret-syncer, optional: reads Secrets. Only for a remote whose
#      Submariner resource sets brokerK8sSecret; enroll-remote.sh binds it on request.
#   3. Policy submariner-remote-cluster-ownership: account cluster-<id> writes only the objects of cluster <id>.
#   4. Policy submariner-remote-cluster-subnets: Endpoint subnets stay within the enrolled subnets.
#   5. Policy submariner-remote-cluster-exports: a remote publishes only its enrolled services.
#   6. Policy submariner-remote-cluster-records: no service account writes the enrollment records.
#
# The account of a remote is cluster-<clusterID> in submariner-k8s-broker, the name the operator expects.
# Checked fields: Cluster.spec.cluster_id, Endpoint.spec.cluster_id, Endpoint.spec.subnets.
# Cluster labels on broker copies:
#   submariner-io/clusterID                    - every copy of the broker syncer
#   multicluster.kubernetes.io/source-cluster  - EndpointSlices and per-cluster ServiceImports
#   lighthouse.submariner.io/sourceCluster     - legacy ServiceImport label
# An aggregated ServiceImport (one per service, named <service>-<namespace>) has no cluster label; its
# exporters are listed in status.clusters[].cluster. Older Lighthouse versions also wrote an annotation
# timestamp.submariner.io/<clusterID> per exporter. 0.25 writes none, but old imports can keep it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: submariner-remote-cluster
  namespace: submariner-k8s-broker
rules:
  # Gateway datastore syncer: publishes the remote's Cluster and Endpoint, reads everyone's.
  - apiGroups: [submariner.io]
    resources: [clusters, endpoints]
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
      - delete
  # Lighthouse agent: aggregated ServiceImports (status.clusters is written through the status subresource
  # because the mcs-api CRD declares subresources.status; admiral util.CreateOrUpdate calls UpdateStatus).
  - apiGroups: [multicluster.x-k8s.io]
    resources: [serviceimports, serviceimports/status]
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
      - delete
  # Lighthouse agent: EndpointSlices of exported services. endpointslices/restricted is the authorization
  # check the API server performs for endpoint addresses in restricted ranges; it never reaches admission.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices, endpointslices/restricted]
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
      - delete
# Intentionally absent compared with the upstream broker client Role:
#   submariner.io brokers get/list  - only subctl and the broker-side controller read the Broker resource
#   secrets get/list/watch          - see the optional Role below
#   serviceaccounts get/list        - used by no runtime component
---
# OPTIONAL. Bind this Role (in addition to submariner-remote-cluster) only for a remote whose Submariner
# resource sets spec.brokerK8sSecret. The operator then starts a "Broker secret syncer" that GETs, LISTs and
# WATCHes Secrets in the broker namespace with the remote's token; without these verbs the Submariner
# reconcile fails before any DaemonSet is created. Any account holding this Role can read
# every Secret in submariner-k8s-broker, so the namespace must hold no Secret worth protecting.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: submariner-remote-cluster-secret-syncer
  namespace: submariner-k8s-broker
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: submariner-remote-cluster-ownership
spec:
  # A CEL error or an unavailable policy denies the request rather than letting it through.
  failurePolicy: Fail
  matchConstraints:
    # Equivalent (the default) also matches the other served versions of a listed resource. Both MCS
    # versions are listed, so the rule matches whichever versions the CRDs serve.
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
    resourceRules:
      - apiGroups: [submariner.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [clusters, endpoints]
      - apiGroups: [discovery.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources:
          - endpointslices
      # serviceimports/status must be listed: the Lighthouse agent updates status.clusters through the
      # status subresource. On such a request object/oldObject are complete objects.
      - apiGroups: [multicluster.x-k8s.io]
        apiVersions: [v1alpha1, v1beta1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [serviceimports, serviceimports/status]
  matchConditions:
    # Only the remote accounts. The central broker account (submariner-operator/submariner-broker-client),
    # administrators, controllers and Argo CD are not affected.
    - name: caller-is-remote-cluster-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:submariner-k8s-broker:cluster-')
  variables:
    # 'system:serviceaccount:submariner-k8s-broker:cluster-' is 52 characters long.
    - name: callerID
      expression: request.userInfo.username.substring(52)
    - name: isCreate
      expression: request.operation == 'CREATE'
    - name: isUpdate
      expression: request.operation == 'UPDATE'
    - name: isDelete
      expression: request.operation == 'DELETE'
    # The object whose ownership is judged: the incoming object, or the stored one for DELETE (object is null).
    - name: target
      expression: 'variables.isDelete ? oldObject : object'
    # The stored object on UPDATE. Kind-specific fields (spec.cluster_id, spec.ips) are read through
    # variables, so the type check does not warn about the other kinds.
    - name: previous
      expression: oldObject
    - name: isCluster
      expression: request.resource.group == 'submariner.io' && request.resource.resource
        == 'clusters'
    - name: isEndpoint
      expression: request.resource.group == 'submariner.io' && request.resource.resource
        == 'endpoints'
    - name: isEndpointSlice
      expression: request.resource.group == 'discovery.k8s.io' && request.resource.resource
        == 'endpointslices'
    - name: isServiceImport
      expression: >-
        request.resource.group == 'multicluster.x-k8s.io' && request.resource.resource
        == 'serviceimports'
    - name: targetLabels
      expression: 'has(variables.target.metadata.labels) ? variables.target.metadata.labels
        : {}'
    # oldObject is null on CREATE; the old* variables are only referenced behind isUpdate guards.
    - name: oldLabels
      expression: 'has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}'
    - name: targetAnnotations
      expression: 'has(variables.target.metadata.annotations) ? variables.target.metadata.annotations
        : {}'
    - name: oldAnnotations
      expression: 'has(oldObject.metadata.annotations) ? oldObject.metadata.annotations
        : {}'
    - name: clusterLabelKeys
      expression: >-
        ['submariner-io/clusterID', 'multicluster.kubernetes.io/source-cluster',
         'lighthouse.submariner.io/sourceCluster']
    # Every cluster label that is present names the caller.
    - name: targetOwnedByCaller
      expression: >-
        variables.clusterLabelKeys.all(k,
          !(k in variables.targetLabels) || variables.targetLabels[k] == variables.callerID)
    - name: oldOwnedByCaller
      expression: >-
        variables.clusterLabelKeys.all(k,
          !(k in variables.oldLabels) || variables.oldLabels[k] == variables.callerID)
    - name: targetHasClusterLabel
      expression: variables.clusterLabelKeys.exists(k, k in variables.targetLabels)
    # Aggregated ServiceImport: no cluster label, and an annotation with the exported service name.
    - name: isAggregatedServiceImport
      expression: >-
        variables.isServiceImport && !variables.targetHasClusterLabel
        && 'multicluster.kubernetes.io/service-name' in variables.targetAnnotations
    - name: timestampPrefix
      expression: "'timestamp.submariner.io/'"
    - name: callerTimestampKey
      expression: variables.timestampPrefix + variables.callerID
    - name: allocatedByKey
      expression: "'lighthouse.submariner.io/clusterset-ip-allocated-by'"
    - name: serviceNameKey
      expression: "'multicluster.kubernetes.io/service-name'"
    - name: sourceNamespaceKey
      expression: "'lighthouse.submariner.io/sourceNamespace'"
    # Names of the exporting clusters recorded in status.clusters ([] when absent).
    - name: targetClusters
      expression: >-
        has(variables.target.status) && has(variables.target.status.clusters)
        ? variables.target.status.clusters.map(c, c.cluster) : []
    - name: oldClusters
      expression: >-
        has(oldObject.status) && has(oldObject.status.clusters)
        ? oldObject.status.clusters.map(c, c.cluster) : []
  validations:
    # --- submariner.io Cluster and Endpoint -----------------------------------------------------------
    - expression: >-
        !(variables.isCluster || variables.isEndpoint)
        || (has(variables.target.spec.cluster_id)
            && variables.target.spec.cluster_id == variables.callerID
            && variables.targetOwnedByCaller
            && (!variables.isUpdate
                || (has(variables.previous.spec.cluster_id)
                    && variables.previous.spec.cluster_id == variables.callerID
                    && variables.oldOwnedByCaller)))
      message: spec.cluster_id of a Cluster or Endpoint must equal the cluster ID
        of the calling account
      messageExpression: >-
        'spec.cluster_id must equal the caller cluster ID ' + variables.callerID
        + ' (operation ' + request.operation + ')'
      reason: Forbidden
    # Object names follow the gateway's naming (Cluster: <clusterID>; Endpoint: <clusterID>-<cableName>).
    # Cluster IDs enrolled by enroll-remote.sh are DNS-1123 labels, so admiral's EnsureValidName leaves
    # them unchanged.
    - expression: >-
        !(variables.isCluster || variables.isEndpoint)
        || (variables.isCluster
            ? variables.target.metadata.name == variables.callerID
            : variables.target.metadata.name.startsWith(variables.callerID + '-'))
      message: Cluster objects must be named <clusterID> and Endpoint objects <clusterID>-<cableName>
      messageExpression: >-
        'object name ' + variables.target.metadata.name + ' does not belong to cluster
        ' + variables.callerID
      reason: Forbidden
    # --- discovery.k8s.io EndpointSlice -----------------------------------------------------------------
    # Broker copies always carry submariner-io/clusterID (admiral federator) and
    # multicluster.kubernetes.io/source-cluster (lighthouse service_endpoint_slices.go newEndpointSliceFrom).
    - expression: >-
        !variables.isEndpointSlice
        || ('submariner-io/clusterID' in variables.targetLabels
            && 'multicluster.kubernetes.io/source-cluster' in variables.targetLabels
            && variables.targetOwnedByCaller
            && (!variables.isUpdate
                || ('submariner-io/clusterID' in variables.oldLabels && variables.oldOwnedByCaller)))
      message: >-
        EndpointSlices must carry submariner-io/clusterID and multicluster.kubernetes.io/source-cluster
        naming the calling cluster
      messageExpression: >-
        'EndpointSlice ' + variables.target.metadata.name + ' does not belong to cluster
        ' + variables.callerID
      reason: Forbidden
    # --- cluster labels are immutable on UPDATE (all kinds) -----------------------------------------
    # Prevents relabelling a foreign or shared object into one's own, or stripping the ownership labels.
    - expression: >-
        !variables.isUpdate
        || variables.clusterLabelKeys.all(k,
             (k in variables.oldLabels) == (k in variables.targetLabels)
             && (!(k in variables.oldLabels) || variables.oldLabels[k] == variables.targetLabels[k]))
      message: cluster ownership labels may not be added, removed or changed on update
      reason: Forbidden
    # --- ServiceImport, per-cluster copy (has cluster labels) ----------------------------------------------
    # One per export and cluster, named <service>-<random suffix>. The exporters compare the copies to agree on
    # ports and session affinity.
    - expression: >-
        !(variables.isServiceImport && variables.targetHasClusterLabel)
        || (variables.targetOwnedByCaller && (!variables.isUpdate || variables.oldOwnedByCaller))
      message: a per-cluster ServiceImport must be labelled with the cluster ID of
        the calling account
      messageExpression: >-
        'ServiceImport ' + variables.target.metadata.name + ' does not belong to cluster
        ' + variables.callerID
      reason: Forbidden
    # A per-cluster copy may not take the name of the aggregated import, <service>-<namespace>. That would
    # block the aggregated import for the other exporters.
    - expression: >-
        !(variables.isServiceImport && variables.targetHasClusterLabel && variables.isCreate)
        || !((variables.serviceNameKey in variables.targetLabels
              && variables.sourceNamespaceKey in variables.targetLabels
              && object.metadata.name == variables.targetLabels[variables.serviceNameKey]
        + '-'
                 + variables.targetLabels[variables.sourceNamespaceKey])
             || (variables.serviceNameKey in variables.targetAnnotations
                 && variables.sourceNamespaceKey in variables.targetAnnotations
                 && object.metadata.name == variables.targetAnnotations[variables.serviceNameKey]
        + '-'
                    + variables.targetAnnotations[variables.sourceNamespaceKey]))
      message: a per-cluster ServiceImport may not take the name <service>-<namespace>
        of the aggregated import
      reason: Forbidden
    # --- ServiceImport of unknown shape is refused --------------------------------------------------------
    - expression: >-
        !variables.isServiceImport || variables.targetHasClusterLabel || variables.isAggregatedServiceImport
      message: >-
        ServiceImports on the broker are either per-cluster copies (cluster labels)
        or aggregated imports
        (multicluster.kubernetes.io/service-name annotation)
      reason: Forbidden
    # --- aggregated ServiceImport, CREATE -----------------------------------------------------------------
    # Lighthouse 0.25 records no creator in the object; the API server audit log does. These rules bind the new
    # object to its export instead: no field names another cluster, the name matches the export, and a
    # clusterset IP names its allocator. The API server drops status on create; the agent then writes
    # status.clusters through /status.
    - expression: >-
        !(variables.isAggregatedServiceImport && variables.isCreate)
        || (variables.targetAnnotations.filter(k, k.startsWith(variables.timestampPrefix))
                 .all(k, k == variables.callerTimestampKey)
            && (!(variables.allocatedByKey in variables.targetAnnotations)
                || variables.targetAnnotations[variables.allocatedByKey] == variables.callerID)
            && variables.targetClusters.all(c, c == variables.callerID))
      message: >-
        a new aggregated ServiceImport may not record another cluster
        (timestamp.submariner.io/<id> annotations, clusterset-ip-allocated-by, status.clusters)
      reason: Forbidden
    # Lighthouse names the aggregated import <service>-<namespace>. The export policy checks the annotations;
    # this rule makes the name match them, so no cluster can take the import name of another service.
    - expression: >-
        !(variables.isAggregatedServiceImport && variables.isCreate)
        || (variables.sourceNamespaceKey in variables.targetAnnotations
            && object.metadata.name == variables.targetAnnotations[variables.serviceNameKey]
        + '-'
               + variables.targetAnnotations[variables.sourceNamespaceKey])
      message: a new aggregated ServiceImport must be named <service-name>-<sourceNamespace>
        after its annotations
      reason: Forbidden
    # Lighthouse sets spec.ips and clusterset-ip-allocated-by together, at creation, so a clusterset IP must
    # name the caller as its allocator. The UPDATE rules freeze both.
    - expression: >-
        !(variables.isAggregatedServiceImport && variables.isCreate)
        || !has(variables.target.spec) || !has(variables.target.spec.ips)
        || size(variables.target.spec.ips) == 0
        || (variables.allocatedByKey in variables.targetAnnotations
            && variables.targetAnnotations[variables.allocatedByKey] == variables.callerID)
      message: a new aggregated ServiceImport may set spec.ips only with clusterset-ip-allocated-by
        naming the calling cluster
      reason: Forbidden
    # --- aggregated ServiceImport, UPDATE: status.clusters -------------------------------------------------
    # Every exporter updates this shared object, but may only add or remove its own entry in status.clusters.
    # On a main-resource update the API server copies status from the stored object, so this holds trivially;
    # it is enforced on /status updates.
    - expression: >-
        !(variables.isAggregatedServiceImport && variables.isUpdate)
        || variables.oldClusters.filter(c, c != variables.callerID)
           == variables.targetClusters.filter(c, c != variables.callerID)
      message: an exporting cluster may only add or remove its own entry in status.clusters
      messageExpression: >-
        'status.clusters may only change the entry of cluster ' + variables.callerID
      reason: Forbidden
    # --- aggregated ServiceImport, UPDATE: annotations -------------------------------------------------------
    # Other clusters' timestamp annotations, the clusterset IP allocator and the service identity are frozen.
    # On a /status update the API server keeps the stored metadata, so this holds trivially there.
    - expression: >-
        !(variables.isAggregatedServiceImport && variables.isUpdate)
        || (variables.oldAnnotations
              .filter(k, k.startsWith(variables.timestampPrefix) && k != variables.callerTimestampKey)
              .all(k, k in variables.targetAnnotations
                      && variables.targetAnnotations[k] == variables.oldAnnotations[k])
            && variables.targetAnnotations
              .filter(k, k.startsWith(variables.timestampPrefix) && k != variables.callerTimestampKey)
              .all(k, k in variables.oldAnnotations)
            && (!(variables.allocatedByKey in variables.oldAnnotations)
                || (variables.allocatedByKey in variables.targetAnnotations
                    && variables.targetAnnotations[variables.allocatedByKey]
                       == variables.oldAnnotations[variables.allocatedByKey]))
            && (!(variables.serviceNameKey in variables.oldAnnotations)
                || variables.targetAnnotations[variables.serviceNameKey]
                   == variables.oldAnnotations[variables.serviceNameKey])
            && (!(variables.sourceNamespaceKey in variables.oldAnnotations)
                || (variables.sourceNamespaceKey in variables.targetAnnotations
                    && variables.targetAnnotations[variables.sourceNamespaceKey]
                       == variables.oldAnnotations[variables.sourceNamespaceKey])))
      message: >-
        only the calling cluster's timestamp annotation may change on an aggregated
        ServiceImport; the
        service identity and the clusterset IP allocator are immutable
      reason: Forbidden
    # --- aggregated ServiceImport, UPDATE: spec.type and spec.ips are fixed at creation --------------------
    - expression: >-
        !(variables.isAggregatedServiceImport && variables.isUpdate)
        || ((has(variables.previous.spec.type) ? variables.previous.spec.type : '')
              == (has(variables.target.spec.type) ? variables.target.spec.type : '')
            && (has(variables.previous.spec.ips) ? variables.previous.spec.ips : [])
              == (has(variables.target.spec.ips) ? variables.target.spec.ips : []))
      message: spec.type and spec.ips of an aggregated ServiceImport may not change
        after creation
      reason: Forbidden
    # --- aggregated ServiceImport, DELETE -------------------------------------------------------------------
    # Only the last exporter deletes: Lighthouse deletes the import when removing itself leaves status.clusters
    # empty, so the stored object lists only the caller. Lighthouse also deletes an import another cluster has
    # just created and not yet claimed; that delete is refused and retried until the import is claimed.
    # An administrator deletes an import without exporters (check-central.sh reports it).
    - expression: >-
        !(variables.isAggregatedServiceImport && variables.isDelete)
        || variables.targetClusters == [variables.callerID]
      message: an aggregated ServiceImport may only be deleted by the last cluster
        that exports the service
      messageExpression: >-
        'ServiceImport ' + variables.target.metadata.name
        + (size(variables.targetClusters) == 0
           ? ' lists no exporting cluster; an administrator deletes it'
           : ' is exported by: ' + variables.targetClusters.join(', '))
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: submariner-remote-cluster-ownership
spec:
  policyName: submariner-remote-cluster-ownership
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
---
# Subnet pinning. Parameters are the enrollment ConfigMaps cluster-<id> (label
# submariner.io/remote-enrollment: "true", data.subnets: comma-separated CIDRs). Kept separate from the
# ownership policy on purpose: a policy with paramRef and parameterNotFoundAction Allow is skipped entirely
# when no parameter matches, which must never happen to the ownership rules.
#
# Change this policy and the export policy with kubectl apply only, and always keep at least one of their
# bindings. Before Kubernetes 1.38, when no bound policy uses ConfigMap parameters, the API server stops
# reading them for good (kubernetes/kubernetes#141015). Records created or changed after that are ignored
# until every API server restarts. verify-enrollment.sh shows it: an export outside the record is admitted,
# or a new export in the record is refused.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: submariner-remote-cluster-subnets
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
    resourceRules:
      - apiGroups: [submariner.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [endpoints]
  matchConditions:
    - name: caller-is-remote-cluster-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:submariner-k8s-broker:cluster-')
  variables:
    - name: callerID
      expression: request.userInfo.username.substring(52)
    # With a selector every matching ConfigMap is evaluated once; the request is admitted only if all
    # evaluations pass. This variable makes evaluations against other clusters' ConfigMaps pass.
    - name: paramIsCaller
      expression: params.metadata.name == 'cluster-' + variables.callerID
    - name: allowedSubnets
      expression: >-
        has(params.data) && 'subnets' in params.data
        ? params.data['subnets'].split(',').map(s, s.trim()).filter(s, s != '') :
        []
  validations:
    # Each Endpoint subnet must equal, or be contained in, one of the enrolled CIDRs (cidr()/isCIDR()
    # need Kubernetes >= 1.30). A ConfigMap without a subnets entry pins nothing.
    - expression: >-
        !variables.paramIsCaller
        || variables.allowedSubnets.size() == 0
        || !has(object.spec.subnets)
        || object.spec.subnets.all(s,
             variables.allowedSubnets.exists(a,
               a == s.trim()
               || (isCIDR(a) && isCIDR(s.trim()) && cidr(a).containsCIDR(cidr(s.trim())))))
      message: Endpoint spec.subnets must lie within the subnets recorded for the
        cluster at enrollment
      messageExpression: >-
        'Endpoint subnets [' + object.spec.subnets.join(', ') + '] are not within
        the enrolled subnets ['
        + variables.allowedSubnets.join(', ') + '] of cluster ' + variables.callerID
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: submariner-remote-cluster-subnets
spec:
  policyName: submariner-remote-cluster-subnets
  validationActions: [Deny]
  paramRef:
    namespace: submariner-k8s-broker
    selector:
      matchLabels:
        submariner.io/remote-enrollment: 'true'
    # No enrollment ConfigMap at all: nothing to pin, the request passes this policy (ownership is still
    # enforced by submariner-remote-cluster-ownership). With Deny an empty selection would reject instead.
    parameterNotFoundAction: Allow
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
---
# Export pinning. Parameters are the same enrollment ConfigMaps: data.exports lists the services the remote
# may publish, as comma-separated <namespace>/<service> entries. The ownership policy checks who writes an
# object; this one checks which service it publishes. Without it a remote could join any service of the other
# clusters, such as the worker service of another federation.
#
# lighthouse.submariner.io/sourceNamespace and multicluster.kubernetes.io/service-name name the service: as
# labels on EndpointSlices and per-cluster ServiceImports, as annotations on aggregated ServiceImports. Every
# name an object carries must be enrolled. An EndpointSlice must carry the labels, because the importers read
# them; a ServiceImport must carry at least one of the two forms.
#
# A record without exports allows none, and with no record at all every export is refused. Not covered: an
# account without a record while other records exist. enroll-remote.sh creates the record before the
# RoleBinding, revoke-remote.sh deletes it last, and check-central.sh reports an account without one.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: submariner-remote-cluster-exports
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
    resourceRules:
      - apiGroups: [discovery.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [endpointslices]
      # The agent adds itself to status.clusters through /status; object is then the complete object.
      - apiGroups: [multicluster.x-k8s.io]
        apiVersions: [v1alpha1, v1beta1]
        operations: [CREATE, UPDATE]
        resources: [serviceimports, serviceimports/status]
  matchConditions:
    - name: caller-is-remote-cluster-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:submariner-k8s-broker:cluster-')
  variables:
    - name: callerID
      expression: request.userInfo.username.substring(52)
    # With a selector every matching ConfigMap is evaluated once; the request is admitted only if all
    # evaluations pass. This variable makes evaluations against other clusters' ConfigMaps pass.
    - name: paramIsCaller
      expression: params.metadata.name == 'cluster-' + variables.callerID
    - name: allowedExports
      expression: >-
        has(params.data) && 'exports' in params.data
        ? params.data['exports'].split(',').map(s, s.trim()).filter(s, s != '') :
        []
    - name: isEndpointSlice
      expression: request.resource.group == 'discovery.k8s.io'
    - name: labels
      expression: 'has(object.metadata.labels) ? object.metadata.labels : {}'
    - name: annotations
      expression: 'has(object.metadata.annotations) ? object.metadata.annotations
        : {}'
    - name: namespaceKey
      expression: "'lighthouse.submariner.io/sourceNamespace'"
    - name: serviceKey
      expression: "'multicluster.kubernetes.io/service-name'"
    - name: hasLabelIdentity
      expression: >-
        variables.namespaceKey in variables.labels || variables.serviceKey in variables.labels
    - name: hasAnnotationIdentity
      expression: >-
        variables.namespaceKey in variables.annotations || variables.serviceKey in
        variables.annotations
    # <namespace>/<service> as the object states it; a missing half stays empty and matches no entry.
    - name: labelExport
      expression: >-
        (variables.namespaceKey in variables.labels ? variables.labels[variables.namespaceKey]
        : '')
        + '/' + (variables.serviceKey in variables.labels ? variables.labels[variables.serviceKey]
        : '')
    - name: annotationExport
      expression: >-
        (variables.namespaceKey in variables.annotations ? variables.annotations[variables.namespaceKey]
        : '')
        + '/' + (variables.serviceKey in variables.annotations ? variables.annotations[variables.serviceKey]
        : '')
    - name: labelExportAllowed
      expression: '!variables.hasLabelIdentity || variables.labelExport in variables.allowedExports'
    - name: annotationExportAllowed
      expression: >-
        !variables.hasAnnotationIdentity || variables.annotationExport in variables.allowedExports
  validations:
    - expression: >-
        !variables.paramIsCaller
        || ((variables.isEndpointSlice
               ? variables.hasLabelIdentity
               : (variables.hasLabelIdentity || variables.hasAnnotationIdentity))
            && variables.labelExportAllowed
            && variables.annotationExportAllowed)
      message: the object publishes a service that is not in the exports recorded
        for the calling cluster at enrollment
      messageExpression: >-
        'cluster ' + variables.callerID + ' may not publish '
        + (!variables.labelExportAllowed ? variables.labelExport
            : (!variables.annotationExportAllowed ? variables.annotationExport
                : 'an object without service name and source namespace'))
        + '; exports recorded at enrollment: [' + variables.allowedExports.join(',
        ') + ']'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: submariner-remote-cluster-exports
spec:
  policyName: submariner-remote-cluster-exports
  validationActions: [Deny]
  paramRef:
    namespace: submariner-k8s-broker
    selector:
      matchLabels:
        submariner.io/remote-enrollment: 'true'
    # No enrollment ConfigMap at all: no remote account may publish a service.
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
---
# Enrollment records. The ConfigMaps cluster-<id> are the parameters of the subnet and export policies, so
# only people write them (enroll-remote.sh, revoke-remote.sh). The gateway and operator ClusterRoles may
# create and update ConfigMaps in every namespace; this policy stops their tokens from changing a record.
# The namespace and garbage-collector controllers are exempt, so the namespace can still be deleted.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: submariner-remote-cluster-records
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
  matchConditions:
    - name: caller-is-service-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:')
        && !(request.userInfo.username in ['system:serviceaccount:kube-system:namespace-controller',
             'system:serviceaccount:kube-system:generic-garbage-collector'])
  variables:
    # The objects the request touches. request.name is empty for generateName and for each item of a
    # collection delete, so the names come from the objects.
    - name: objects
      expression: >-
        request.operation == 'CREATE' ? [object]
        : (request.operation == 'DELETE' ? [oldObject] : [object, oldObject])
  validations:
    - expression: >-
        variables.objects.all(o, !o.metadata.name.startsWith('cluster-')
          && !(has(o.metadata.labels) && 'submariner.io/remote-enrollment' in o.metadata.labels))
      message: a service account may not write an enrollment record (ConfigMap cluster-<id>
        or labelled submariner.io/remote-enrollment)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: submariner-remote-cluster-records
spec:
  policyName: submariner-remote-cluster-records
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: submariner-k8s-broker
