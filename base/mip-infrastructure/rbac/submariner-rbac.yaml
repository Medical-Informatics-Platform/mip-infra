---
# Namespaces required by Submariner components and RBACs below
apiVersion: v1
kind: Namespace
metadata:
  name: submariner-operator
---
apiVersion: v1
kind: Namespace
metadata:
  name: submariner-k8s-broker
---
# Extracted from submariner-operator Helm chart
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-operator
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [create, get, list, watch, update]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, create, update, delete, watch]
  - apiGroups: ['']
    resources: [pods, services, nodes]
    verbs: [get, list, watch]
  - apiGroups: [operator.openshift.io]
    resources: [dnses]
    verbs: [get, update]
  - apiGroups: [config.openshift.io]
    resources: [networks]
    resourceNames: [cluster]
    verbs: [get]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [list]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, list, update]
  # Since 0.21.1 the operator discovers the service CIDR by listing the
  # networking.k8s.io ServiceCIDR resources (pkg/discovery/network/generic.go,
  # client.List); Kubernetes 1.33 changed the error text the previous probe parsed.
  - apiGroups: [networking.k8s.io]
    resources: [servicecidrs]
    verbs: [list]
  # Since 0.24 the operator's manager caches Broker objects across all
  # namespaces (cmd/main.go, cache ByObject Broker: AllNamespaces); without
  # list and watch the cache never syncs and the operator exits.
  - apiGroups: [submariner.io]
    resources: [brokers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-operator
subjects:
  - kind: ServiceAccount
    name: submariner-operator
    namespace: submariner-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-operator
---
# Extracted from submariner-k8s-broker (submariner) Helm chart
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-gateway
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch, create, update]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [pods, services, nodes]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [operator.openshift.io]
    resources: [dnses]
    verbs: [get, list, watch, update]
  - apiGroups: [config.openshift.io]
    resources: [networks]
    verbs: [get, list]
  - apiGroups: [submariner.io]
    resources: [endpoints, gateways, clusters]
    verbs: [create, get, list, watch, update, patch, delete]
  - apiGroups: [submariner.io]
    resources: [gateways/status]
    verbs: [update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, list, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-routeagent
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch, update]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [operator.openshift.io]
    resources: [dnses]
    verbs: [get, list, watch, update]
  - apiGroups: [config.openshift.io]
    resources: [networks]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list, watch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-routeagent
subjects:
  - kind: ServiceAccount
    name: submariner-routeagent
    namespace: submariner-k8s-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-routeagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-globalnet
subjects:
  - kind: ServiceAccount
    name: submariner-globalnet
    namespace: submariner-k8s-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-globalnet
---
# Namespaced Roles/Bindings (Extracted to prevent ArgoCD sync errors)
#
# Broker client Role of the account used by the central operator itself.
# Because the operator references the broker credentials through
# brokerK8sSecret, it runs a "broker secret syncer" that lists and watches
# Secrets in this namespace and blocks reconciliation until that list
# succeeds; secrets get/list/watch must therefore stay. Nothing sensitive may
# be stored in this namespace besides this account's own token: the IPsec PSK
# lives in submariner-operator only. serviceaccounts get/list (granted by the
# upstream chart) is used by no runtime component and is dropped.
#
# This account is not handed to remote clusters; remote nodes use their own
# cluster-<id> accounts bound to the narrower submariner-remote-cluster Role
# (base/mip-infrastructure/rbac/submariner-remote-admission.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: submariner-broker-submariner-k8s-broker-cluster
  namespace: submariner-k8s-broker
rules:
  - apiGroups: [submariner.io]
    resources: [clusters, endpoints]
    verbs: [create, get, list, watch, patch, update, delete]
  - apiGroups: [submariner.io]
    resources: [brokers]
    verbs: [get, list]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [serviceimports, serviceimports/status]
    verbs: [create, get, list, watch, patch, update, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices, endpointslices/restricted]
    verbs: [create, get, list, watch, patch, update, delete]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: submariner-broker-submariner-k8s-broker-cluster
  namespace: submariner-k8s-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: submariner-broker-submariner-k8s-broker-cluster
subjects:
  - kind: ServiceAccount
    name: submariner-broker-submariner-k8s-broker-client
    namespace: submariner-k8s-broker
---
# Operator ClusterRoles and ClusterRoleBindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-gateway
subjects:
  - kind: ServiceAccount
    name: submariner-gateway
    namespace: submariner-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-lighthouse-agent
rules:
  - apiGroups: ['']
    resources: [services, namespaces, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices, endpointslices/restricted]
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - delete
      - deletecollection
  - apiGroups: [submariner.io]
    resources: [gateways, globalingressips]
    verbs: [get, list, watch]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [serviceimports, serviceimports/status]
    verbs: [create, get, list, watch, update, delete]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [serviceexports]
    verbs: [get, list, watch]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [serviceexports/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-lighthouse-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-lighthouse-agent
subjects:
  - kind: ServiceAccount
    name: submariner-lighthouse-agent
    namespace: submariner-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-lighthouse-coredns
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [submariner.io]
    resources: [gateways, submariners]
    verbs: [get, list, watch]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [serviceimports]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-lighthouse-coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-lighthouse-coredns
subjects:
  - kind: ServiceAccount
    name: submariner-lighthouse-coredns
    namespace: submariner-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-routeagent
rules:
  - apiGroups: ['']
    resources: [pods, services, configmaps, endpoints]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [ovn-cert]
    verbs: [get]
  - apiGroups: [config.openshift.io]
    resources: [networks]
    resourceNames: [cluster]
    verbs: [get]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list, watch, update]
  - apiGroups: [projectcalico.org]
    resources: [ippools]
    verbs: [get, create, delete, update, deletecollection]
  - apiGroups: [submariner.io]
    resources: [endpoints]
    verbs: [get, list, watch]
  - apiGroups: [submariner.io]
    resources: [routeagents, gatewayroutes, nongatewayroutes]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-routeagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-routeagent
subjects:
  - kind: ServiceAccount
    name: submariner-routeagent
    namespace: submariner-operator
---
# RBAC for broker secret copier job (used by PostSync hook). In the broker
# namespace the hook only reads the client token secret and removes a legacy
# PSK copy; it writes secrets in the operator namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broker-secret-handler
  namespace: submariner-k8s-broker
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-secret-copier-reader
  namespace: submariner-k8s-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: broker-secret-handler
subjects:
  - kind: ServiceAccount
    name: broker-secret-copier
    namespace: submariner-k8s-broker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-secret-writer
  namespace: submariner-operator
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-secret-copier-writer
  namespace: submariner-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-secret-writer
subjects:
  - kind: ServiceAccount
    name: broker-secret-copier
    namespace: submariner-k8s-broker
---
# Namespaced permissions for submariner-operator to watch resources in its own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: submariner-operator-namespace
  namespace: submariner-operator
rules:
  - apiGroups: [submariner.io]
    resources: [gateways, servicediscoveries, submariners, brokers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [submariner.io]
    resources:
      - gateways/status
      - servicediscoveries/status
      - submariners/status
      - brokers/status
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [services, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: submariner-operator-namespace
  namespace: submariner-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: submariner-operator-namespace
subjects:
  - kind: ServiceAccount
    name: submariner-operator
    namespace: submariner-operator
---
# Since 0.24 every component reads its own ConfigMap and the shared
# submariner-global ConfigMap in this namespace at start-up and watches them
# for changes (admiral pkg/configmap: Get, then List and Watch through an
# informer); a forbidden Get is fatal for the gateway, the route agent, the
# Lighthouse agent and the Lighthouse CoreDNS plugin. Upstream grants this in
# one namespaced Role per component. The gateway's Secret access is granted
# separately below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: submariner-component-config
  namespace: submariner-operator
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: submariner-component-config
  namespace: submariner-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: submariner-component-config
subjects:
  - kind: ServiceAccount
    name: submariner-gateway
    namespace: submariner-operator
  - kind: ServiceAccount
    name: submariner-routeagent
    namespace: submariner-operator
  - kind: ServiceAccount
    name: submariner-lighthouse-agent
    namespace: submariner-operator
  - kind: ServiceAccount
    name: submariner-lighthouse-coredns
    namespace: submariner-operator
---
# Since 0.24 the gateway's libreswan driver creates its certificate signing
# requestor at start-up in every authentication mode
# (pkg/cable/libreswan/libreswan.go, NewLibreswan); the requestor runs an
# informer on the Secrets of this namespace labelled submariner.io/csr-request
# (admiral pkg/certificate/signing_requestor.go), and the gateway stays passive
# until that cache syncs ("failed to list Secret ... forbidden" in its log
# otherwise). RBAC cannot restrict a list to a label, so list and watch cover
# the namespace; in PSK mode nothing is ever written, so the create, update and
# delete verbs of the upstream gateway Role (certificate-auth mode,
# ceIPSecUseOVNCertAuthMode, not enabled here) are not granted. The gateway
# already receives the PSK and the broker token as mounted volumes, so this
# read access exposes nothing it does not hold.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: submariner-gateway-secrets
  namespace: submariner-operator
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: submariner-gateway-secrets
  namespace: submariner-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: submariner-gateway-secrets
subjects:
  - kind: ServiceAccount
    name: submariner-gateway
    namespace: submariner-operator
