---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mip-argo-project-common
  namespace: argocd-mip-team
spec:
  description: Common shared resources like datacatalog and ingress
  sourceRepos:
    - https://github.com/Medical-Informatics-Platform/mip-infra.git
    - https://github.com/Medical-Informatics-Platform/datacatalog
  destinations:
    - namespace: mip-common-datacatalog
      server: https://kubernetes.default.svc
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: PersistentVolume
    - group: networking.k8s.io
      kind: IngressClass
    - group: cert-manager.io
      kind: ClusterIssuer
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: Pod
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: Issuer
  # Explicitly blacklist sensitive resources to be future proof
  clusterResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  # RBAC is never managed by this project; make it explicit
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  roles:
    - name: common-admin
      description: Full access to common resources
      policies:
        - p, proj:mip-argo-project-common:common-admin, applications, get, mip-argo-project-common/*,
          allow
        - p, proj:mip-argo-project-common:common-admin, applications, create, mip-argo-project-common/*,
          allow
        - p, proj:mip-argo-project-common:common-admin, applications, update, mip-argo-project-common/*,
          allow
        - p, proj:mip-argo-project-common:common-admin, applications, delete, mip-argo-project-common/*,
          allow
        - p, proj:mip-argo-project-common:common-admin, applications, sync, mip-argo-project-common/*,
          allow
      groups: [argocd-admins]
    - name: common-operator
      description: Limited access to common resources
      policies:
        - p, proj:mip-argo-project-common:common-operator, applications, sync, mip-argo-project-common/*,
          allow
        - p, proj:mip-argo-project-common:common-operator, applications, get, mip-argo-project-common/*,
          allow
      groups: [argocd-operators]
