---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mip-argo-project-security
  namespace: argocd-mip-team
spec:
  description: Network security policies and isolation controls for MIP infrastructure
  sourceRepos:
    - https://github.com/Medical-Informatics-Platform/mip-infra.git
    - git@github.com:Medical-Informatics-Platform/mip-deployments.git
  destinations:
    # Allow deployment to federation namespaces for network policies
    - namespace: federation-*
      server: https://kubernetes.default.svc
    # Allow deployment to common namespaces for network policies
    - namespace: mip-common-*
      server: https://kubernetes.default.svc
    # Jupyter AI proxy (common/athena-proxy) and notebook operator
    # (common/notebook-operator)
    - namespace: mip-athena
      server: https://kubernetes.default.svc
    - namespace: mip-notebooks-system
      server: https://kubernetes.default.svc
    # Nominal destination of netpol-remote-clusters, which renders
    # cluster-scoped objects only (common/security/remote-clusters)
    - namespace: argocd-mip-team
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    # Allow namespace creation for auto-discovered federations
    - group: ''
      kind: Namespace
    # Calico tier and global policy confining the Submariner remote CIDRs
    - group: projectcalico.org
      kind: Tier
    - group: projectcalico.org
      kind: GlobalNetworkPolicy
  namespaceResourceWhitelist:
    # Allow NetworkPolicy management in namespaces. Application is not listed:
    # the netpol-* Applications are created by the ApplicationSet controller,
    # and with argocd-mip-team as a destination the entry would let this
    # project create Applications in the Argo CD namespace.
    - group: networking.k8s.io
      kind: NetworkPolicy
  # Explicitly blacklist sensitive resources
  clusterResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  # RBAC is never managed by this project; make it explicit
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  syncWindows:
    - kind: allow
      schedule: '* * * * *'
      duration: 24h
      applications: ['*']
  roles:
    - name: security-admin
      description: Full access to network security policies
      policies:
        - p, proj:mip-argo-project-security:security-admin, applications, get, mip-argo-project-security/*,
          allow
        - p, proj:mip-argo-project-security:security-admin, applications, create,
          mip-argo-project-security/*, allow
        - p, proj:mip-argo-project-security:security-admin, applications, update,
          mip-argo-project-security/*, allow
        - p, proj:mip-argo-project-security:security-admin, applications, delete,
          mip-argo-project-security/*, allow
        - p, proj:mip-argo-project-security:security-admin, applications, sync, mip-argo-project-security/*,
          allow
      groups: [argocd-admins]
    - name: security-operator
      description: Limited access to network security policies
      policies:
        - p, proj:mip-argo-project-security:security-operator, applications, sync,
          mip-argo-project-security/*, allow
        - p, proj:mip-argo-project-security:security-operator, applications, get,
          mip-argo-project-security/*, allow
      groups: [argocd-operators]
