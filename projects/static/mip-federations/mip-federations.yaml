---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mip-argo-project-federations
  namespace: argocd-mip-team
spec:
  description: Federation-specific applications and configurations
  sourceRepos:
    - https://github.com/Medical-Informatics-Platform/mip-infra.git
    - git@github.com:Medical-Informatics-Platform/mip-deployments.git
    - https://github.com/madgik/exareme2
    - https://github.com/Medical-Informatics-Platform/mip
  destinations:
    - namespace: argocd-mip-team
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
  # Explicitly blacklist sensitive resources to be future proof
  clusterResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  syncWindows:
    - kind: allow
      schedule: '* * * * *'
      duration: 24h
      applications: ['*']
  roles:
    - name: federation-admin
      description: Full access to federation resources
      policies:
        - p, proj:mip-argo-project-federations:federation-admin, applications, get,
          mip-argo-project-federations/*, allow
        - p, proj:mip-argo-project-federations:federation-admin, applications, create,
          mip-argo-project-federations/*, allow
        - p, proj:mip-argo-project-federations:federation-admin, applications, update,
          mip-argo-project-federations/*, allow
        - p, proj:mip-argo-project-federations:federation-admin, applications, delete,
          mip-argo-project-federations/*, allow
        - p, proj:mip-argo-project-federations:federation-admin, applications, sync,
          mip-argo-project-federations/*, allow
      groups: [argocd-admins]
    - name: federation-developer
      description: Limited access to federation resources
      policies:
        - p, proj:mip-argo-project-federations:federation-developer, applications,
          sync, mip-argo-project-federations/*, allow
        - p, proj:mip-argo-project-federations:federation-developer, applications,
          get, mip-argo-project-federations/*, allow
      groups: [argocd-developers]
