---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-stack
  namespace: argocd-mip-team
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: mip-argo-project-monitoring
  source:
    repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
    targetRevision: main
    path: common/monitoring/eck
    helm:
      releaseName: eck
      skipCrds: true
      values: |
        # Per platform policy: keep ECK resources in their own namespace
        # (created by Argo via CreateNamespace=true) instead of kube-system.
        operator:
          namespace: elastic-system
        elasticsearch:
          nodeSets:
            - name: default
              count: 3
              config:
                node.store.allow_mmap: false
              podTemplate:
                # No empty metadata/labels maps: the ECK operator strips
                # zero-value fields, leaving Argo CD permanently OutOfSync.
                spec:
                  containers:
                    - name: elasticsearch
                      resources:
                        requests:
                          cpu: 500m
                          memory: 2Gi
                        limits:
                          cpu: 2
                          memory: 2Gi
              volumeClaimTemplates:
                - metadata:
                    name: elasticsearch-data
                  spec:
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 50Gi
                    storageClassName: ceph-corbo-rbd-hdd-retain
        observability:
          metricbeat:
            enabled: true
          filebeat:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    # Beats run with hostNetwork/hostPath mounts and DAC_READ_SEARCH to collect
    # node-level logs and metrics, so the namespace must opt out of PSA baseline.
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/managed-by: argocd
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      selfHeal: true
      prune: true
    # Without a retry policy, automated sync never re-attempts a revision
    # after one failed/terminated operation and the app parks OutOfSync.
    # The ECK operator mutates the Elastic CRs it co-owns, so selfHeal can
    # terminate a sync that is still waiting on Elasticsearch health (seen
    # during the 8.19.19 e2e run) — retry lets the app converge on its own.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      # Server-side apply avoids client-side patch timeouts on large
      # Elastic CRs that the ECK operator concurrently mutates.
      - ServerSideApply=true
      - CreateNamespace=true
