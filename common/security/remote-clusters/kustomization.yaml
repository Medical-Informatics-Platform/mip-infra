# common/security/remote-clusters: the Calico tier for traffic exchanged with
# remote clusters and its end-of-tier policy. Generic: the per-federation
# policies come from ../remote-networks. Plain manifests; kustomize needs no
# Calico CRD to render them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [tier.yaml]
