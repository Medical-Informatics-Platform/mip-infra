---
# ApplicationSet for auto-discovered federation network policies
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: federation-network-policies
  namespace: argocd-mip-team
  labels:
    app.kubernetes.io/managed-by: argocd
    argocd.instance: mip-team
  annotations:
    argocd.argoproj.io/note: Auto-discovers federations and applies network isolation
      policies
spec:
  generators:
    # Auto-discover federation directories - same pattern as main ApplicationSet
    - matrix:
        generators:
          - git:
              repoURL: git@github.com:Medical-Informatics-Platform/mip-deployments.git
              revision: main
              directories:
                # Local federations
                - path: deployments/local/federations/*
                # Hybrid federations: the same default deny; the allows for the
                # remote CIDRs live in each federation's submariner-policies
                - path: deployments/hybrid/federations/*/mip-infrastructure
          - list:
              elements:
                - cluster: https://kubernetes.default.svc
                  namespace: argocd-mip-team
                  clusterName: default
  goTemplate: true
  template:
    metadata:
      name: netpol-{{ if contains "local" .path.path }}{{ .path.basename | lower }}-local{{
        else }}{{ .path.path | dir | base | lower }}-hybrid{{ end }}
      labels:
        app.kubernetes.io/part-of: federation-network-policies
        app.kubernetes.io/managed-by: argocd
    spec:
      project: mip-argo-project-security
      source:
        repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
        targetRevision: main
        path: common/security/federation
        helm:
          parameters:
            - name: targetNamespace
              value: '{{ if contains "local" .path.path }}{{ .path.basename | lower
                }}{{ else }}{{ .path.path | dir | base | lower }}{{ end }}'
            - name: federationType
              value: '{{ if contains "local" .path.path }}local{{ else }}hybrid{{
                end }}'
      # No excludedSelector parameter: the isolation policy selects every pod
      # of the namespace. The former exception (app NotIn exareme2-worker)
      # matched no pod since exaflow 1.0.0 renamed the labels; excluding the
      # workers again requires the least-privilege worker policies to land in
      # the same change (see common/security/README.md).
      destination:
        server: '{{ .cluster }}'
        namespace: '{{ if contains "local" .path.path }}{{ .path.basename | lower
          }}{{ else }}{{ .path.path | dir | base | lower }}{{ end }}'
      syncPolicy:
        syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
        # Labels of the federation namespace. Cluster-wide policies select
        # hybrid federations by mip.federation-type, so every federation
        # namespace must carry it; this Application is the one that manages it.
        managedNamespaceMetadata:
          labels:
            name: '{{ if contains "local" .path.path }}{{ .path.basename | lower
              }}{{ else }}{{ .path.path | dir | base | lower }}{{ end }}'
            app.kubernetes.io/managed-by: argocd
            mip.namespace-type: federation
            mip.federation-type: '{{ if contains "local" .path.path }}local{{ else }}hybrid{{
              end }}'
        automated:
          selfHeal: true
---
# ApplicationSet for common namespace network policies
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: common-network-policies
  namespace: argocd-mip-team
  labels:
    app.kubernetes.io/managed-by: argocd
    argocd.instance: mip-team
  annotations:
    argocd.argoproj.io/note: Deploys network isolation policies to common namespaces
spec:
  generators:
    - list:
        elements:
          - commonNamespace: mip-common-datacatalog
  goTemplate: true
  template:
    metadata:
      name: netpol-{{ .commonNamespace }}
      labels:
        app.kubernetes.io/part-of: common-network-policies
        app.kubernetes.io/managed-by: argocd
    spec:
      project: mip-argo-project-security
      source:
        repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
        targetRevision: main
        path: common/security/common-templates
        helm:
          parameters:
            - name: targetNamespace
              value: '{{ .commonNamespace }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .commonNamespace }}'
      syncPolicy:
        syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
        managedNamespaceMetadata:
          labels:
            name: '{{ .commonNamespace }}'
            app.kubernetes.io/managed-by: argocd
            mip.namespace-type: common
        automated:
          selfHeal: true
---
# Cluster-wide confinement of the Submariner remote CIDRs: a Calico Tier and
# GlobalNetworkPolicy (common/security/remote-clusters). Plain manifests, so
# kustomize renders them without the Calico CRDs; the cluster serves
# projectcalico.org/v3 through the Calico API server. No prune, like the other
# policy Applications: removing the policy from git leaves it on the cluster
# until deleted by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netpol-remote-clusters
  namespace: argocd-mip-team
  labels:
    app.kubernetes.io/part-of: common-network-policies
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/note: Confines traffic from and to remote clusters to the exaflow components of
      hybrid federations
spec:
  project: mip-argo-project-security
  source:
    repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
    targetRevision: main
    path: common/security/remote-clusters
  destination:
    server: https://kubernetes.default.svc
    # Nominal: only cluster-scoped objects are rendered. Argo CD still checks
    # this field against the project destinations.
    namespace: argocd-mip-team
  syncPolicy:
    syncOptions: [ApplyOutOfSyncOnly=true]
    automated:
      selfHeal: true
