---
# ApplicationSet for auto-discovered federation network policies
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: federation-network-policies
  namespace: argocd-mip-team
  labels:
    app.kubernetes.io/managed-by: argocd
    argocd.instance: mip-team
  annotations:
    argocd.argoproj.io/note: Auto-discovers federations and applies network isolation
      policies
spec:
  generators:
    # Auto-discover federation directories - same pattern as main ApplicationSet
    - matrix:
        generators:
          - git:
              repoURL: git@github.com:Medical-Informatics-Platform/mip-deployments.git
              revision: main
              directories:
                # Local federations
                - path: deployments/local/federations/*
                # Hybrid federations: the same default deny; the allows for the
                # remote CIDRs live in each federation's submariner-policies
                - path: deployments/hybrid/federations/*/mip-infrastructure
          - list:
              elements:
                - cluster: https://kubernetes.default.svc
                  namespace: argocd-mip-team
                  clusterName: default
  goTemplate: true
  template:
    metadata:
      name: netpol-{{ if contains "local" .path.path }}{{ .path.basename | lower }}-local{{
        else }}{{ .path.path | dir | base | lower }}-hybrid{{ end }}
      labels:
        app.kubernetes.io/part-of: federation-network-policies
        app.kubernetes.io/managed-by: argocd
    spec:
      project: mip-argo-project-security
      source:
        repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
        targetRevision: main
        path: common/security/federation
        helm:
          parameters:
            - name: targetNamespace
              value: '{{ if contains "local" .path.path }}{{ .path.basename | lower
                }}{{ else }}{{ .path.path | dir | base | lower }}{{ end }}'
            - name: federationType
              value: '{{ if contains "local" .path.path }}local{{ else }}hybrid{{
                end }}'
      # No excludedSelector parameter: the isolation policy selects every pod
      # of the namespace except the notebooks, which get their own rules without
      # internet (notebook-network-policy.yaml). The former exception
      # (app NotIn exareme2-worker) matched no pod since exaflow 1.0.0 renamed
      # the labels; excluding the workers again requires the least-privilege
      # worker policies to land in the same change (see common/security/README.md).
      destination:
        server: '{{ .cluster }}'
        namespace: '{{ if contains "local" .path.path }}{{ .path.basename | lower
          }}{{ else }}{{ .path.path | dir | base | lower }}{{ end }}'
      syncPolicy:
        syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
        # Labels of the federation namespace, managed by this Application.
        # The policies of the common namespaces select federations by
        # mip.federation-type (common-templates, federationAccess). The
        # remote-clusters tier uses no labels: each hybrid federation's policy
        # names its namespace (federation-remote-networks below).
        managedNamespaceMetadata:
          labels:
            name: '{{ if contains "local" .path.path }}{{ .path.basename | lower }}{{
              else }}{{ .path.path | dir | base | lower }}{{ end }}'
            app.kubernetes.io/managed-by: argocd
            mip.namespace-type: federation
            mip.federation-type: '{{ if contains "local" .path.path }}local{{ else
              }}hybrid{{ end }}'
        automated:
          selfHeal: true
---
# ApplicationSet for common namespace network policies
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: common-network-policies
  namespace: argocd-mip-team
  labels:
    app.kubernetes.io/managed-by: argocd
    argocd.instance: mip-team
  annotations:
    argocd.argoproj.io/note: Deploys network isolation policies to common namespaces
spec:
  generators:
    - list:
        elements:
          - commonNamespace: mip-common-datacatalog
          - commonNamespace: mip-athena
          - commonNamespace: mip-notebooks-system
  goTemplate: true
  template:
    metadata:
      name: netpol-{{ .commonNamespace }}
      labels:
        app.kubernetes.io/part-of: common-network-policies
        app.kubernetes.io/managed-by: argocd
    spec:
      project: mip-argo-project-security
      source:
        repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
        targetRevision: main
        path: common/security/common-templates
        helm:
          parameters:
            - name: targetNamespace
              value: '{{ .commonNamespace }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .commonNamespace }}'
      syncPolicy:
        syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
        managedNamespaceMetadata:
          labels:
            name: '{{ .commonNamespace }}'
            app.kubernetes.io/managed-by: argocd
            mip.namespace-type: common
        automated:
          selfHeal: true
---
# Calico tier for the traffic exchanged with remote clusters over Submariner,
# and its end-of-tier policy (common/security/remote-clusters). Generic: the
# policy of each hybrid federation comes from the ApplicationSet
# federation-remote-networks below. Plain manifests, so kustomize renders them
# without the Calico CRDs; the cluster serves projectcalico.org/v3 through the
# Calico API server. No prune, like the other policy Applications: removing a
# policy from git leaves it on the cluster until deleted by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netpol-remote-clusters
  namespace: argocd-mip-team
  labels:
    app.kubernetes.io/part-of: common-network-policies
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/note: Calico tier for the traffic exchanged with remote clusters
spec:
  project: mip-argo-project-security
  source:
    repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
    targetRevision: main
    path: common/security/remote-clusters
  destination:
    server: https://kubernetes.default.svc
    # Nominal: only cluster-scoped objects are rendered. Argo CD still checks
    # this field against the project destinations.
    namespace: argocd-mip-team
  syncPolicy:
    syncOptions: [ApplyOutOfSyncOnly=true]
    automated:
      selfHeal: true
---
# One Calico policy per hybrid federation in the remote-clusters tier:
# remote-clusters.<namespace>, built by the chart
# common/security/remote-networks. It passes the federation's remote networks
# only to the exaflow components of the federation's namespace and denies
# them everywhere else. The generator reads the file remote-networks.yaml of
# every hybrid federation directory: the directory name gives the namespace,
# as for federation-network-policies above, and the file gives the networks.
# Nothing under common/ names a federation or a network.
#
# preserveResourcesOnDeletion: when a federation's file disappears, its
# Application is removed but the policy stays on the cluster and keeps
# confining the federation's remote networks until it is deleted by hand.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: federation-remote-networks
  namespace: argocd-mip-team
  labels:
    app.kubernetes.io/managed-by: argocd
    argocd.instance: mip-team
  annotations:
    argocd.argoproj.io/note: Assigns the remote networks of each hybrid federation
      to its namespace
spec:
  generators:
    - git:
        repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
        revision: main
        files:
          - path: deployments/hybrid/federations/*/mip-infrastructure/remote-networks.yaml
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: netpol-{{ .path.path | dir | base | lower }}-remote
      labels:
        app.kubernetes.io/part-of: federation-network-policies
        app.kubernetes.io/managed-by: argocd
    spec:
      project: mip-argo-project-security
      source:
        repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
        targetRevision: main
        path: common/security/remote-networks
        helm:
          # remoteNodes is the list from the federation's file, passed as JSON
          # (which is YAML); a file without that key renders no policy.
          values: |
            targetNamespace: {{ .path.path | dir | base | lower | quote }}
            remoteNodes: {{ toJson .remoteNodes }}
      destination:
        server: https://kubernetes.default.svc
        # Nominal: only a cluster-scoped object is rendered. Argo CD still
        # checks this field against the project destinations.
        namespace: argocd-mip-team
      syncPolicy:
        syncOptions: [ApplyOutOfSyncOnly=true]
        automated:
          selfHeal: true
