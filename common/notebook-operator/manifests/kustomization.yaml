---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mip-notebooks-system
resources:
  - deployment.yaml
  - rbac-manager-cronjob.yaml
  - api-proxy.yaml
  - api-proxy-certificates.yaml
# Scripts and configuration as ConfigMaps. No hash suffix: this Application does not prune, so
# every change would leave the previous ConfigMap behind and the Application OutOfSync. The
# CronJob starts a new pod per run and reads the current script. nginx renders its template only
# at start: after a change to api-proxy.conf.template, restart the proxy
# (kubectl -n mip-notebooks-system rollout restart deployment notebook-api-proxy).
configMapGenerator:
  - name: mip-notebook-rbac-manager
    files: [reconcile.sh]
  - name: notebook-api-proxy
    files: [default.conf.template=api-proxy.conf.template]
generatorOptions:
  disableNameSuffixHash: true
