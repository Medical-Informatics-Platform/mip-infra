---
# Notebook API proxy: the JupyterHub pod of a federation reaches the Kubernetes API only through
# this nginx, which allowlists the Notebook and token Secret paths (api-proxy.conf.template) and
# forwards the hub's own token; RBAC and the admission policies of the API server stay the
# authorizers. Serving certificate and CA: api-proxy-certificates.yaml. Network policies:
# common/security (the hubs may always reach it; apiServer.hubDirect: false closes the direct
# path). Design and the next step: how-to-implement-the-notebook-properly.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-api-proxy
  namespace: mip-notebooks-system
  labels:
    app.kubernetes.io/name: notebook-api-proxy
  annotations:
    # NetworkPolicy notebook-api-proxy: common/security/common-templates (Helm, not seen by the scan).
    checkov.io/skip1: CKV2_K8S_6=NetworkPolicy rendered by common/security/common-templates
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-api-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notebook-api-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Any UID works: nginx writes only to the emptyDirs below. The group is the image's nginx
        # group; fsGroup lets the TLS key be mounted read-only for it.
        runAsUser: 10101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: notebook-api-proxy
      containers:
        - name: nginx
          # Pinned by digest; Renovate follows the tag (renovate.json5, kubernetes manager).
          image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
          env:
            # The entrypoint renders /etc/nginx/templates with envsubst; only the two
            # kubelet-set variables are substituted, nginx variables stay untouched.
            - {name: NGINX_ENVSUBST_FILTER, value: ^KUBERNETES_SERVICE_(HOST|PORT)$}
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: templates, mountPath: /etc/nginx/templates, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
            - {name: tls, mountPath: /etc/notebook-api-proxy/tls, readOnly: true}
            - {name: cluster-ca, mountPath: /etc/notebook-api-proxy/ca, readOnly: true}
      volumes:
        - name: templates
          configMap: {name: notebook-api-proxy}
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: tls
          secret: {secretName: notebook-api-proxy-tls, defaultMode: 0o440}
        # The cluster CA every namespace carries; the proxy verifies the API server with it.
        - name: cluster-ca
          configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: notebook-api-proxy
  namespace: mip-notebooks-system
spec:
  selector:
    app.kubernetes.io/name: notebook-api-proxy
  ports:
    - {name: https, port: 443, targetPort: https}
