---
# Submariner operator Application. The broker has no Application: its namespace and RBAC are applied
# out of band (base/mip-infrastructure/rbac/submariner-rbac.yaml), and the operator installs the broker
# CRDs (Submariner and MCS) on every reconcile.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: submariner-operator
  namespace: argocd-mip-team
spec:
  project: mip-argo-project-submariner
  sources:
    - repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
      targetRevision: main
      path: common/submariner/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: submariner-operator
  ignoreDifferences:  # for cached resources when we do manual tests
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jqPathExpressions: [.metadata.labels]
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      jqPathExpressions: [.metadata.labels]
    - group: rbac.authorization.k8s.io
      kind: Role
      jqPathExpressions: [.metadata.labels]
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
      jqPathExpressions: [.metadata.labels]
  syncPolicy:
    syncOptions: [CreateNamespace=true]
    automated:
      selfHeal: true
      prune: false
