---
# Keeps systemd-networkd on the gateway node from deleting the policy routing the
# Submariner route agent installs there: the rule "from all lookup 150" and the
# table-150 routes to the remote CIDRs with the CNI address as source. Host-originated
# traffic, the gateway's own health-check pings included, only matches the IPsec
# policies through them. networkd removes routes and routing policy rules it did not
# create every time it starts (defaults ManageForeignRoutes=yes and
# ManageForeignRoutingPolicyRules=yes), and unattended upgrades restart it through
# needrestart (openssl update, 2026-09-30). The route agent programs the rule only at
# gateway transition and endpoint events, so nothing restores it; the connections then
# show "error" with the SAs established and Lighthouse stops answering for the cluster.
#
# The pod runs only on the gateway node, mounts the networkd drop-in directory and
# nothing else, writes one file and idles. No network, no API access, no capabilities.
# The file takes effect at the next networkd start, which is the only moment it
# matters; nothing is restarted. Recovery after such an event is a restart of the
# route agent pod on the gateway node (README, "Gateway node").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: submariner-gateway-node-config
  namespace: submariner-operator
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: submariner-gateway-node-config
  namespace: submariner-operator
  labels:
    app: submariner-gateway-node-config
spec:
  selector:
    matchLabels:
      app: submariner-gateway-node-config
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: submariner-gateway-node-config
    spec:
      serviceAccountName: submariner-gateway-node-config
      automountServiceAccountToken: false
      nodeSelector:
        submariner.io/gateway: "true"
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: networkd-dropin
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -eu
              f=/host/networkd.conf.d/10-submariner-foreign-routes.conf
              want='[Network]
              ManageForeignRoutes=no
              ManageForeignRoutingPolicyRules=no'
              if [ "$(cat "$f" 2>/dev/null)" = "$want" ]; then
                echo "$f up to date"
              else
                printf '%s\n' "$want" > "$f"
                chmod 0644 "$f"
                echo "$f written; effective at the next systemd-networkd start"
              fi
              trap 'exit 0' TERM INT
              while :; do sleep 3600 & wait $!; done
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: networkd-conf-d
              mountPath: /host/networkd.conf.d
      volumes:
        - name: networkd-conf-d
          hostPath:
            path: /etc/systemd/networkd.conf.d
            type: DirectoryOrCreate
