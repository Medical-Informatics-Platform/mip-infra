      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-routeagent
  # Rendered by the chart since 0.24 (ConfigMap reads for the Lighthouse
  # components); created by the operator at runtime like the other
  # namespaced component RBAC above.
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-lighthouse-agent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
