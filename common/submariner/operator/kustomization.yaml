---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: submariner-operator
    repo: https://raw.githubusercontent.com/submariner-io/submariner-charts/gh-pages/charts
    version: 0.25.0
    releaseName: submariner-operator
    namespace: submariner-operator
    valuesFile: values.yaml
    includeCRDs: true
resources:
  - gateway-loadbalancer-ip.yaml
  - broker-credentials.yaml
  - gateway-node-networkd.yaml
patches:
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-operator
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-operator
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-gateway
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-gateway
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-gateway
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-gateway
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-routeagent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-routeagent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-lighthouse-agent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-lighthouse-agent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-lighthouse-agent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-lighthouse-agent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-lighthouse-coredns
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-lighthouse-coredns
  # Namespaced RBAC resources
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-metrics-reader
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-metrics-reader
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-gateway
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-gateway
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-operator
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-routeagent
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: read-submariner-metrics
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: read-submariner-metrics
  - target:
