    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-lighthouse-agent
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-lighthouse-coredns
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
