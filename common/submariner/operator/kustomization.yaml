---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: submariner-operator
    repo: https://raw.githubusercontent.com/submariner-io/submariner-charts/gh-pages/charts
    version: 0.25.0
    releaseName: submariner-operator
    namespace: submariner-operator
    valuesFile: values.yaml
    includeCRDs: true
resources:
  - broker-credentials.yaml
  - gateway-node-networkd.yaml
  - gateway-route-watchdog.yaml
patches:
  # Gateway LoadBalancer address and MetalLB pool. The operator owns the Service submariner-gateway
  # and replaces its spec on every reconcile, but merges spec.loadBalancerServiceAnnotations into it.
  # The chart has no value for this field. Remote nodes accept IPsec only from this address. It is
  # also set in deployments/hybrid/federations/federation-Z/remote-node/central.env and in the
  # remote-nodes group of the hardening inventory; change all three together.
  - target:
      group: submariner.io
      kind: Submariner
      name: submariner
    patch: |-
      apiVersion: submariner.io/v1alpha1
      kind: Submariner
      metadata:
        name: submariner
      spec:
        loadBalancerServiceAnnotations:
          metallb.io/address-pool: pool-no-auto
          metallb.universe.tf/address-pool: pool-no-auto
          metallb.io/loadBalancerIPs: 148.187.143.43
          metallb.universe.tf/loadBalancerIPs: 148.187.143.43
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-operator
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-operator
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-gateway
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-gateway
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-gateway
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-gateway
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-routeagent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-routeagent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-lighthouse-agent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-lighthouse-agent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-lighthouse-agent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-lighthouse-agent
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: submariner-lighthouse-coredns
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: submariner-lighthouse-coredns
  # Namespaced RBAC resources
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-metrics-reader
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-metrics-reader
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-gateway
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-gateway
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-operator
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-routeagent
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: read-submariner-metrics
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: read-submariner-metrics
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: submariner-gateway
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-gateway
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: submariner-operator
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-operator
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: submariner-routeagent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-routeagent
  # Rendered by the chart since 0.24 (ConfigMap reads for the Lighthouse
  # components); created by the operator at runtime like the other
  # namespaced component RBAC above.
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-lighthouse-agent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-lighthouse-agent
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: submariner-lighthouse-agent
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-lighthouse-agent
  - target:
      group: rbac.authorization.k8s.io
      kind: Role
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: submariner-lighthouse-coredns
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: submariner-lighthouse-coredns
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: submariner-lighthouse-coredns
