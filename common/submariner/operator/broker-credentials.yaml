---
# Broker credentials of the central cluster. The broker runs in this cluster, so the operator uses a
# local account. The token controller writes the keys token and ca.crt into the Secret below (type
# kubernetes.io/service-account-token). The operator and its components read them through
# brokerK8sSecret (values.yaml).
#
# Permissions in the broker namespace: RoleBinding submariner-broker-submariner-k8s-broker-cluster in
# base/mip-infrastructure/rbac/submariner-rbac.yaml. None in this namespace.
#
# The token does not expire. To rotate it, delete the Secret: Argo CD recreates it, the token controller
# issues a new token and the operator restarts the components that mount it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: submariner-broker-client
  namespace: submariner-operator
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: submariner-broker-client-token
  namespace: submariner-operator
  annotations:
    kubernetes.io/service-account.name: submariner-broker-client
type: kubernetes.io/service-account-token
