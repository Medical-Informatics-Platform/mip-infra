---
# Values for Public RKE2 Operator
# These override defaults from official submariner-operator chart
# Cluster identification - Updated from actual deployment
submariner:
  clusterId: mip-fqdn

  # Network configuration - From deployed cluster
  clusterCidr: 10.42.0.0/16  # Pod network CIDR
  serviceCidr: ''  # Not specified (empty in deployed config)
  # Globalnet disabled (CIDRs don't overlap)
  globalCidr: ''

  # Clusterset IP configuration for service discovery
  clustersetIpCidr: 243.0.0.0/20
  clustersetIpEnabled: false

  # NAT traversal enabled for remote clusters behind NAT
  natEnabled: true

  # LoadBalancer service type for gateway
  loadBalancerEnabled: true

  # Cable driver - From deployed config
  cableDriver: libreswan

  # Broker credentials: token Secret of the operator's broker account (broker-credentials.yaml).
  # The operator mounts it as files, not as environment variables.
  brokerK8sSecret: submariner-broker-client-token
# Broker connection. token and ca stay empty: the credentials come from submariner.brokerK8sSecret.
broker:
  server: mip.chuv.cscs.ch:6443
  token: ''
  ca: ''
  namespace: submariner-k8s-broker
  insecure: false
rbac:
  create: false  # Managed externally for security
# Service discovery enabled (this is at submariner level in the chart)
# Already set above as submariner.serviceDiscovery
# Gateway/IPsec configuration
ipsec:
  natPort: 4500
  ikePort: 500
  # IPsec PSK, key psk. Created once by hand, not in git (common/submariner/README.md, Install, step 2).
  # Remote clusters get the same value at enrollment.
  pskSecret: submariner-ipsec-psk
# The gateway LoadBalancer address and MetalLB pool are set in kustomization.yaml
# (spec.loadBalancerServiceAnnotations); the chart has no value for them.
# Resource requirements
operator:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
