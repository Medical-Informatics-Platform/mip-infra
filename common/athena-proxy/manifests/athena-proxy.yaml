---
apiVersion: v1
kind: ConfigMap
metadata:
  name: athena-proxy
  namespace: mip-athena
data:
  # Rendered by the nginx image entrypoint (envsubst on /etc/nginx/templates).
  default.conf.template: |
    server {
        listen 8080;
        location = /healthz {
            return 200 "ok\n";
        }

        # Only the OpenAI-compatible API is forwarded.
        location /v1/ {
            proxy_pass ${CODEX_UPSTREAM}/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Responses stream (SSE); pass tokens through as they arrive.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 32m;
        }
        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-proxy
  namespace: mip-athena
  labels:
    app: athena-proxy
  annotations:
    # nginx renders the upstream with envsubst, so it can only come from the environment; the
    # value is an endpoint URL, kept in a Secret only so it stays out of git.
    checkov.io/skip1: CKV_K8S_35=envsubst reads the upstream URL from the environment
    # NetworkPolicy athena-proxy: common/security/common-templates (Helm, not seen by the scan).
    checkov.io/skip2: CKV2_K8S_6=NetworkPolicy rendered by common/security/common-templates
spec:
  replicas: 1
  selector:
    matchLabels:
      app: athena-proxy
  template:
    metadata:
      labels:
        app: athena-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Any UID works: nginx writes only to the emptyDirs below.
        runAsUser: 10101
        runAsGroup: 10101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          # Pinned by digest; Renovate follows the tag (renovate.json5, kubernetes manager).
          image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
          env:
            # e.g. http://host:8888/v1, no trailing slash.
            - name: CODEX_UPSTREAM
              valueFrom:
                secretKeyRef: {name: codex-llm, key: base-url}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: templates, mountPath: /etc/nginx/templates, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: templates
          configMap: {name: athena-proxy}
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: athena-proxy
  namespace: mip-athena
spec:
  selector:
    app: athena-proxy
  ports:
    - {name: http, port: 80, targetPort: http}
