---
name: Lint YAML and Auto-commit Fixes
on:
  pull_request:
    branches: [main]
jobs:
  lint-and-fix:
    name: Lint YAML and Auto-commit Fixes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits to the PR branch
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # Checkout the PR head branch
          token: ${{ secrets.GITHUB_TOKEN }}  # Use GITHUB_TOKEN for commit/push
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      - name: Install yamlfix
        run: pip install yamlfix
      - name: Run yamlfix to find and fix issues
        id: yamlfix
        run: |
          # The yamlfix command will automatically find and apply fixes to any YAML files.
          # It uses the `.yamllint.yml` configuration file for its rules.
          # common/monitoring/eck-stack.yaml is excluded because yamlfix 1.19.1
          # compacts its `syncOptions` block list to flow style and drops the
          # parent indentation, producing invalid YAML
          # (`[ServerSideApply=true, CreateNamespace=true]` at column 0) that
          # breaks `kustomize build`. Drop this exclude once the upstream bug
          # is fixed.
          yamlfix --exclude "**/templates/**" --exclude ".github/workflows/**" --exclude "common/monitoring/eck-stack.yaml" . && yamlfix common/security/kustomization.yaml common/security/netpol.yaml

          # Stage only non-workflow changes so the bot never attempts to modify
          # workflow files, which requires elevated permissions.
          git add --all -- . ':(exclude).github/workflows/**'

          # Check if there are any staged changes to commit.
          if ! git diff --cached --quiet; then
            echo "Changes detected, will commit and push."
            echo "changes_detected=true" >> $GITHUB_ENV
          else
            echo "No changes detected."
            echo "changes_detected=false" >> $GITHUB_ENV
          fi
      - name: Commit and Push Fixes
        if: env.changes_detected == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "style: auto-fix YAML linting issues ✨"
          git push origin "HEAD:${{ github.head_ref }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Final Check
        if: env.changes_detected == 'true'
        run: |
          echo "YAML fixes have been committed and pushed to the PR branch."
          echo "The PR will now reflect these automated changes."
      - name: No Changes Needed
        if: env.changes_detected == 'false'
        run: |-
          echo "✅ All YAML files are correctly formatted. No changes needed."
