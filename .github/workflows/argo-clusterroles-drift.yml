---
name: Argo CD upstream ClusterRole drift
on:
  pull_request:
    branches: [main]
    paths:
      - argo-setup/patches/kustomization.yaml
      - argo-setup/patches/patch-argocd-application-controller-clusterrole.yaml
      - argo-setup/patches/patch-argocd-server-clusterrole.yaml
      - argo-setup/patches/patch-argocd-applicationset-controller-clusterrole.yaml
      - argo-setup/upstream-snapshot/**
      - scripts/check-upstream-argo-clusterroles.sh
      - .github/workflows/argo-clusterroles-drift.yml
  schedule:
    # Weekly run catches upstream releases that bump the rules even when no
    # PR touches argo-setup/.
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install yq (pinned + sha256 verified)
        env:
          YQ_VERSION: v4.53.6
          YQ_SHA256: 38b907b21b1b04327fb9481c595331d925a67c6ee1aabd0ef419d0b7d12dfb3d
        run: |
          set -euo pipefail
          tarball=yq_linux_amd64.tar.gz
          url=https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${tarball}
          curl -sSfLo "$tarball" "$url"
          echo "${YQ_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" ./yq_linux_amd64
          sudo install -m 0755 yq_linux_amd64 /usr/local/bin/yq
          rm -f "$tarball" yq_linux_amd64
      - name: Compare upstream Argo CD ClusterRoles vs reviewed snapshot
        run: bash scripts/check-upstream-argo-clusterroles.sh
