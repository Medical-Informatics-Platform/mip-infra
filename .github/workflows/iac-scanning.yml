---
name: IaC Security Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checkov-scan:
    name: Scan IaC with Checkov
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write # required by upload-sarif to post results to the GitHub Security tab
      actions: read # upload-sarif reads the workflow run for its analysis context (recommended by codeql-action)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        # Checkov renders charts with a plain `helm template`, which puts .Release.Namespace at
        # `default`; Argo CD renders them into the Application's destination namespace. Render
        # them into a named namespace here too (Helm reads HELM_NAMESPACE).
        env:
          HELM_NAMESPACE: checkov-scan
        with:
          directory: .
          framework: kubernetes,helm,kustomize
          output_format: sarif
          output_file_path: checkov-results.sarif
          # argo-setup/patches: kustomize patch fragments produce false
          # positives when scanned standalone.
          # tests/e2e: CI-only kind shims, not production IaC; the checkov
          # container's bundled kustomize also crashes on the eck overlay's
          # embedded helm values (works fine with kustomize v5.8.1).
          skip_path: argo-setup/patches,tests/e2e
          # To be removed once existing findings are resolved
          soft_fail: true

      - name: Upload SARIF to GitHub Security tab
        # Skip the upload where it cannot succeed, so mirrors/forks don't fail the run:
        #  - private repos without GitHub code scanning enabled reject the SARIF upload -
        #    gate on the repo being public, where code scanning is available by default.
        #  - fork PRs get a read-only token, so upload only runs on push or same-repo PRs.
        if: >-
          !cancelled() &&
          hashFiles('checkov-results.sarif') != '' &&
          github.event.repository.private == false &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: checkov-results.sarif
          category: iac-scanning
