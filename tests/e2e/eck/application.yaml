---
# CI variant of common/monitoring/eck-stack.yaml for the e2e `eck` profile.
# Same chart, same namespace wiring; inline values shrink the cluster to what
# a 16 GB runner holds (1 ES node, small heap/PVC) and disable the beats,
# which need privileged hostPath access that adds nothing to a version-bump
# test. The ECK operator itself is installed by scripts/e2e/run-e2e.sh at the
# version pinned in common/monitoring/eck/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: e2e-eck-stack
  namespace: argocd-mip-team
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: mip-argo-project-monitoring
  source:
    repoURL: https://github.com/Medical-Informatics-Platform/mip-infra.git
    targetRevision: main
    path: common/monitoring/eck
    helm:
      releaseName: eck
      skipCrds: true
      values: |
        operator:
          namespace: elastic-system
        elasticsearch:
          nodeSets:
            - name: default
              count: 1
              config:
                node.store.allow_mmap: false
              podTemplate:
                metadata:
                  labels: {}
                spec:
                  containers:
                    - name: elasticsearch
                      resources:
                        requests:
                          cpu: 500m
                          memory: 1Gi
                        limits:
                          cpu: 2
                          memory: 1Gi
              volumeClaimTemplates:
                - metadata:
                    name: elasticsearch-data
                  spec:
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 2Gi
                    storageClassName: ceph-corbo-cephfs
        kibana:
          count: 1
          podTemplate:
            metadata:
              labels: {}
            spec:
              containers:
                - name: kibana
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
                    limits:
                      cpu: 1
                      memory: 1Gi
        observability:
          metricbeat:
            enabled: false
          filebeat:
            enabled: false
        alertNotifier:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/managed-by: argocd
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      selfHeal: true
      prune: true
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
